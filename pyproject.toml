[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["**/__tests__/**", "**/test_*.py", "**/conftest.py"]

[project]
name = "mcp-canada"
version = "0.12.0"
description = "MCP server for Canadian federal government data — bilingual, multi-source, AI-ready."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Reyem Tech", email = "mario@reyem.tech" },
]
keywords = ["mcp", "canada", "government", "open-data", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "aiocache>=0.12.0",
    "tenacity>=8.0.0",
    "InquirerPy>=0.3.4",
    "aiosqlite>=0.22.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/reyemtech/mcp-canada"
Issues = "https://github.com/reyemtech/mcp-canada/issues"

[project.scripts]
mcp-canada = "mcp_canada.server:main"

[project.optional-dependencies]
ircc = [
    "pandas>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov",
    "ruff>=0.4.0",
    "pyright",
    "python-semantic-release>=10.0.0",
    "pytest-timeout>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
markers = [
    "integration: live API tests (skip with -m 'not integration', run with --run-integration)",
    "tolerates_upstream_error(reason): integration test exempt from the masking-idiom guard in tests/test_integration_test_quality.py. A reason is mandatory — state why the test genuinely cannot assert in every branch (documented off-season empty result, key-gated tool, known upstream flakiness).",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["src/mcp_canada"]
omit = ["src/mcp_canada/installer.py"]

[tool.coverage.report]
fail_under = 95

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mcp_canada/__init__.py:__version__"]
commit_parser = "conventional"
branch = "main"
major_on_zero = false
build_command = "pip install build && python -m build"
upload_to_vcs_release = true
allow_zero_version = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- CHANGELOG -->"

[tool.semantic_release.remote]
type = "github"
