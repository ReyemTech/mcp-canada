name: PR Review Verification

on:
  push:
    branches: [chore/contributor-pr-feedback]

permissions: {}

concurrency:
  group: pr-review-verification
  cancel-in-progress: true

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      report: ${{ steps.assess.outputs.final-message }}
      head_sha: ${{ steps.metadata.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare draft PR verification
        id: metadata
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 10 });
            if (pr.head.sha !== context.sha) throw new Error('PR revision changed');
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);
            await require('./.github/scripts/pr-feedback.cjs').prepareReview(
              { github, context: { ...context, repo: context.repo, eventName: 'workflow_dispatch' }, core },
              10, pr.head.sha, 'review-input');
      - name: Prepare review diff
        env:
          BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
        run: |
          git --no-pager diff --no-ext-diff --no-textconv "$BASE_SHA...$HEAD_SHA" > review-input/diff.patch
          test "$(wc -c < review-input/diff.patch)" -le 400000
      - name: Install reviewer runtime
        run: npm install --global @openai/codex@0.163.0
      - name: Isolate reviewer
        run: bash .github/scripts/isolate-reviewer.sh
      - name: Verify temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.PR_REVIEW_ROLE_ARN }}
          aws-region: ${{ vars.PR_REVIEW_AWS_REGION }}
          role-session-name: pr-review-verification-${{ github.run_id }}
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Assess draft PR
        id: assess
        env:
          PR_REVIEW_PROJECT_ID: ${{ vars.PR_REVIEW_PROJECT_ID }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          PR_REVIEW_UNPRIVILEGED_USER: pr-reviewer
        run: python3 .github/scripts/run_review.py

  publish:
    needs: assess
    if: ${{ always() && !cancelled() && needs.assess.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-review-publish-10
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish verification review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_REPORT: ${{ needs.assess.outputs.report }}
          HEAD_SHA: ${{ needs.assess.outputs.head_sha }}
          REVIEW_RESULT: ${{ needs.assess.result }}
        with:
          script: |
            await require('./.github/scripts/pr-feedback.cjs').publish(
              { github, context: { ...context, repo: context.repo, eventName: 'workflow_dispatch' }, core }, {
                number: 10, sha: process.env.HEAD_SHA, raw: process.env.REVIEW_REPORT,
                reason: process.env.REVIEW_RESULT === 'success' ? undefined : 'failed',
              });
