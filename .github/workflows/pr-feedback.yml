name: PR Feedback

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review again
        required: true
        type: number

permissions: {}

concurrency:
  group: pr-feedback-${{ github.event.workflow_run.event || 'manual' }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Publish CI feedback
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.target.outputs.pr_number }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      base_sha: ${{ steps.target.outputs.base_sha }}
    steps:
      # Only trusted default-branch code runs with comment permissions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Locate current PR and update check results
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await require('./.github/scripts/pr-feedback.cjs').prepare({ github, context, core });

  review:
    name: Assess PR changes
    needs: checks
    if: ${{ needs.checks.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      report: ${{ steps.assess.outputs.final-message }}
      configured: ${{ steps.config.outputs.available }}
      size: ${{ steps.diff.outputs.size }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check reviewer configuration
        id: config
        env:
          REVIEW_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$REVIEW_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Read current PR metadata
        id: metadata
        if: ${{ steps.config.outputs.available == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.checks.outputs.pr_number }}
          HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
        with:
          script: |
            await require('./.github/scripts/pr-feedback.cjs').prepareReview(
              { github, context, core }, process.env.PR_NUMBER, process.env.HEAD_SHA, 'review-input');
      - name: Fetch revision as data and bound review size
        id: diff
        if: ${{ steps.metadata.outputs.current == 'true' }}
        env:
          PR_NUMBER: ${{ needs.checks.outputs.pr_number }}
          HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
          BASE_SHA: ${{ needs.checks.outputs.base_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git -c core.hooksPath=/dev/null fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/review/head" "$BASE_SHA"
          test "$(git rev-parse refs/review/head)" = "$HEAD_SHA"
          git --no-pager diff --no-ext-diff --no-textconv "$BASE_SHA...$HEAD_SHA" > review-input/diff.patch
          if [ "$(wc -c < review-input/diff.patch)" -gt 400000 ]; then
            echo 'size=too_large' >> "$GITHUB_OUTPUT"
          else
            echo 'size=ok' >> "$GITHUB_OUTPUT"
          fi
      # No fork checkout, dependency installation, tests, or PR-supplied scripts here.
      # Run the agent last; its result is parsed in a separate, trusted publisher job.
      - name: Assess changes
        id: assess
        if: ${{ steps.diff.outputs.size == 'ok' }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/review/prompt.md
          output-schema-file: .github/review/schema.json
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          allow-users: '*'
          allow-bots: true
          model: ${{ vars.PR_REVIEW_MODEL }}
          effort: medium

  publish:
    name: Publish review
    needs: [checks, review]
    if: ${{ always() && !cancelled() && needs.checks.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-review-publish-${{ needs.checks.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update PR review comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.checks.outputs.pr_number }}
          HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
          REVIEW_REPORT: ${{ needs.review.outputs.report }}
          REVIEW_CONFIGURED: ${{ needs.review.outputs.configured }}
          REVIEW_SIZE: ${{ needs.review.outputs.size }}
          REVIEW_RESULT: ${{ needs.review.result }}
        with:
          script: |
            const reason = process.env.REVIEW_CONFIGURED === 'false' ? 'not_configured'
              : process.env.REVIEW_SIZE === 'too_large' ? 'too_large'
              : process.env.REVIEW_RESULT !== 'success' ? 'failed' : undefined;
            await require('./.github/scripts/pr-feedback.cjs').publish({ github, context, core }, {
              number: process.env.PR_NUMBER, sha: process.env.HEAD_SHA,
              raw: process.env.REVIEW_REPORT, reason,
            });
